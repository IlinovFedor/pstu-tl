                    $ref: '#/components/schemas/YearResponse'
                  rows:
                    type: array
                    items:
                      type: object
                      required:
                        - discipline
                        - term
                        - status
                        - currentHours
                        - currentTeachers
                        - targetHours
                        - targetTeachers
                      properties:
                        discipline:
                          $ref: '#/components/schemas/DisciplineResponse'
                        term: # 0 - оба
                          type: integer
                          enum:
                            - 0
                            - 1
                            - 2
                        status:
                          type: string
                          enum:
                            - removed
                            - added
                            - kept
                        currentHours:
                          type: integer
                        currentTeachers:
                          type: array
                          items:
                            type: string

                        targetHours:
                          type: integer
                        targetTeachers:
                          type: array
                          items:
                            type: string
