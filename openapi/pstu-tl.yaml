components:
  responses:
    Unauthorized:
      description: Пользователь не авторизован (нет сессии)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Недостаточно прав для выполнения операции
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Запрошенный ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Некорректные данные запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    YearBase:
      description: Базовая модель года
      type: object
      required:
        - name
        - wageNormalHours
        - extHourlyWageTier1
        - extHourlyWageTier2
        - extHourlyWageTier3
        - wageTolerance
      properties:
        name:
          type: string
        wageNormalHours:
          type: integer
          minimum: 0
          description:
            Норма часов на ставку
        extHourlyWageTier1:
          type: integer
          minimum: 0
          description:
            Стоимость 1 часа заочников для ассистентов и ст. пр
        extHourlyWageTier2:
          type: integer
          minimum: 0
          description:
            Стоимость 1 часа заочников для доцентов
        extHourlyWageTier3:
          type: integer
          minimum: 0
          description:
            Стоимость 1 часа заочников для профессоров
        wageTolerance:
          type: integer
          minimum: 0
          description:
            Какое отклонение по часам от ставки считается ОК
    YearRequest:
      description: Модель года для запросов
      $ref: '#/components/schemas/YearBase'
    YearResponse:
      description: Модель года для ответов
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
        - $ref: '#/components/schemas/YearBase'

    TeacherBase:
      description: Базовая модель преподавателя
      type: object
      required:
        - job
        - name
        - wage
      properties:
        job:
          type: string
          enum:
            - assistant             # Асс.
            - associateProfessor   # Доц.
            - departmentHead       # Зав. каф.
            - professor             # Проф.
            - seniorLecturer       # Ст. пр.
        name:
          type: string
        wage:
          type: number
          enum: [ 0.25, 0.5, 1 ]
    TeacherRequest:
      description: Модель преподавателя для запросов
      $ref: '#/components/schemas/TeacherBase'
    TeacherResponse:
      description: Модель преподавателя для ответов
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
        - $ref: '#/components/schemas/TeacherBase'

    DisciplineBase:
      description: Базовая модель дисциплины
      type: object
      required:
        - name
      properties:
        name:
          type: string
    DisciplineRequest:
      description: Модель дисциплины для запросов
      $ref: '#/components/schemas/DisciplineBase'
    DisciplineResponse:
      description: Модель дисциплины для ответов
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
        - $ref: '#/components/schemas/DisciplineBase'

    GroupBase:
      description: Базовая модель группы
      type: object
      required:
        - name
        - studentsAmount
        - type
      properties:
        name:
          type: string
        studentsAmount:
          type: integer
          minimum: 1
        type:
          type: string
          enum: [ partTime, undergraduate, postgraduate ]
    GroupRequest:
      description: Модель группы для запросов
      $ref: '#/components/schemas/GroupBase'
    GroupResponse:
      description: Модель группы для ответов
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
        - $ref: '#/components/schemas/GroupBase'

    UserBase:
      description: Базовая модель пользователя
      type: object
      required:
        - name
        - role
      properties:
        name:
          type: string
        role:
          type: string
          enum: [ admin, editor, teacher ]
        associatedTeacherId:
          type: integer
          minimum: 1
    UserRequest:
      description: Модель пользователя для запросов
      $ref: '#/components/schemas/UserBase'
    UserResponse:
      description: Модель пользователя для ответов
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
        - $ref: '#/components/schemas/UserBase'

    FileBase:
      description: Базовая модель файла
      type: object
      required:
        - id
        - name
        - createdAt
        - type
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    FileImportBase:
      description: Базовая модель файла импорта
      allOf:
        - $ref: '#/components/schemas/FileBase'
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - main
                - postgraduate
                - undergraduate
                - partTime
            term:
              type: integer
              enum:
                - 1
                - 2
            isExtra:
              type: boolean

    FileExportBase:
      description: Базовая модель файла экспорта
      $ref: '#/components/schemas/FileBase'

    FileReportBase:
      description: Базовая модель файла отчета
      allOf:
        - $ref: '#/components/schemas/FileBase'
        - type: object
          required:
            - teacherId
          properties:
            teacherId:
              type: integer

    FileReportResponse:
      description: Модель файла отчета для ответа
      allOf:
        - $ref: '#/components/schemas/FileReportBase'
        - type: object
          required:
            - teacher
          properties:
            teacher:
              $ref: '#/components/schemas/TeacherResponse'

    RecordBase:
      description: Базовая модель записи
      type: object
      required:
        - id
        - importFileId
        - groupId
        - disciplineId
        - subgroupNumber
        - term
        - type
        - goalHours
        - currentHours
        - teachersHours
        - isError
      properties:
        id:
          type: integer
          minimum: 1
        importFileId:
          type: integer
          minimum: 1
        groupId:
          type: integer
        disciplineId:
          type: integer
        subgroupNumber:
          type: integer
          minimum: 0
        term:
          type: integer
          enum: [ 1, 2 ]
        type:
          type: string
          enum:
            - lecture              # Лек
            - practice             # Пр
            - lab                  # Лаб
            - ksr                  # КСР

            - courseProject       # КП
            - courseWork          # КР
            - controlWork         # КонтрРаб

            - pass                 # Зач
            - gradedPass          # ДифЗач
            - exam                 # Экз
            - stateExam           # ГосЭкз
            - gek                  # ГЭК

            - thesisSupervision   # РукВКР
            - reviewing            # Рец

            - studyPractice       # УчПр
            - workPractice        # ПрПр
            - preDiplomaPractice # ПредПр
        goalHours:
          type: integer
          minimum: 1
        currentHours:
          type: integer
          minimum: 0
        teachersHours:
          type: array
          items:
            type: object
            required:
              - teacherId
              - hours
              - isExtra
            properties:
              teacherId:
                type: integer
                minimum: 1
              hours:
                type: integer
                minimum: 1
              isExtra:
                type: boolean
        isError:
          type: boolean
    RecordResponse:
      description: Модель записи для ответа
      allOf:
        - $ref: '#/components/schemas/RecordBase'
        - type: object
          required:
            - group
            - discipline
            - teachers
            - importFile
          properties:
            group:
              $ref: '#/components/schemas/GroupResponse'
            discipline:
              $ref: '#/components/schemas/DisciplineResponse'
            teachers:
              type: array
              items:
                $ref: '#/components/schemas/TeacherResponse'
            importFile:
              $ref: '#/components/schemas/FileImportBase'

    Calculations:
      description: Модель калькуляций по преподавателю
      type: object
      required:
        - fullTimeHoursTerm1
        - fullTimeHoursTerm2
        - postgraduateHoursTerm1
        - postgraduateHoursTerm2
        - partTimeHoursTerm1
        - partTimeHoursTerm2
      properties:
        fullTimeHoursTerm1:
          type: integer
          description: Часы очников 1 сем (основная + доп.)
        fullTimeHoursTerm2:
          type: integer
          description: Часы очников 2 сем (основная + доп.)

        postgraduateHoursTerm1:
          type: integer
          description: Часы аспирантуры 1 сем
        postgraduateHoursTerm2:
          type: integer
          description: Часы аспирантуры 2 сем

        calculatedWage:
          type: number
          description: Выработанная доля ставки

        partTimeHoursTerm1:
          type: integer
          description: Часы заочников 1 сем
        partTimeHoursTerm2:
          type: integer
          description: Часы заочников 2 сем

        partTimeCostYearly:
          type: integer
          description: Начислено за заочников за год, ₽

        wageDiffHours:
          type: integer
          description: Отклонение от нормы ставки + перегруз, - недобор

    ActionBase:
      description: Базовая модель события
      type: object
      required:
        - id
        - userId
        - createdAt
        - isReverted
        - diffs
      properties:
        id:
          type: integer
          minimum: 1
        userId:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        isReverted:
          type: boolean
        diffs:
          type: array
          items:
            type: object
            required:
              - recordId
              - teacherId
            properties:
              recordId:
                type: integer
                minimum: 1
              teacherId:
                type: integer
                minimum: 1
              oldHours:
                type: integer
                minimum: 1
              newHours:
                type: integer
                minimum: 1
              oldIsExtra:
                type: boolean
              newIsExtra:
                type: boolean

    Error:
      description: Модель ошибки
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - codeBadRequest
            - codeUnauthorized
            - codeForbidden
            - codeUnknownYear
            - codeUnknownTeacher
            - codeUnknownGroup
            - codeUnknownDiscipline
            - codeUnknownUser
            - codeUnknownFile
            - codeUnknownAction
            - codeCannotRevertAction
        message:
          type: string