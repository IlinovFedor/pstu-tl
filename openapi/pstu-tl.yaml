        schema:
          type: integer
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Скачать файл импорта
      tags:
        - Years/Import
      responses:
        '200':
          description: XLSX файл
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
