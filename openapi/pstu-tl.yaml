      summary: Получить данные записи
      responses:
        '200':
          description: Запись
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Records
      summary: Перезапись часов преподавателей, ошибочность
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - teachers
                - is_error
              properties:
                is_error:
                  type: boolean
                teachers:
                  type: array
                  items:
                    type: object
                    required:
                      - teacher_id
                      - hours
                      - is_extra
                    properties:
                      teacher_id:
                        type: integer
                        minimum: 1
                      hours:
                        type: integer
                        minimum: 1
                      is_extra:
                        type: boolean
      responses:
        '200':
          description: Новые данные записи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

