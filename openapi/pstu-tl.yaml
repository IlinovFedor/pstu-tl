          $ref: '#/components/responses/InternalServerError'

components:
  responses:
    Unauthorized:
      description: Пользователь не авторизован (нет сессии)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Недостаточно прав для выполнения операции
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Запрошенный ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Некорректные данные запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    YearBase:
      type: object
      required:
        - name
        - wage_normal_hours
        - ext_hourly_wage_tier_1
        - ext_hourly_wage_tier_2
        - ext_hourly_wage_tier_3
        - wage_tolerance
      properties:
        name:
          type: string
        wage_normal_hours:
          type: integer
          minimum: 0
          description:
            Норма часов на ставку
        ext_hourly_wage_tier_1:
          type: integer
          minimum: 0
          description:
            Стоимость 1 часа заочников для ассистентов и ст. пр
        ext_hourly_wage_tier_2:
          type: integer
          minimum: 0
          description:
            Стоимость 1 часа заочников для доцентов
        ext_hourly_wage_tier_3:
          type: integer
          minimum: 0
          description:
            Стоимость 1 часа заочников для профессоров
        wage_tolerance:
          type: integer
          minimum: 0
          description:
            Какое отклонение по часам от ставки считается ОК
    YearRequest:
      allOf:
        - $ref: '#/components/schemas/YearBase'
    YearResponse:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
        - $ref: '#/components/schemas/YearBase'

    TeacherBase:
      type: object
      required:
        - job
        - name
        - wage
      properties:
        job:
          type: string
          enum:
            - assistant             # Асс.
            - associate_professor   # Доц.
            - department_head       # Зав. каф.
            - professor             # Проф.
            - senior_lecturer       # Ст. пр.
        name:
          type: string
        wage:
          type: number
          enum: [ 0.25, 0.5, 1 ]
    TeacherRequest:
      allOf:
        - $ref: '#/components/schemas/TeacherBase'
    TeacherResponse:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
        - $ref: '#/components/schemas/TeacherBase'

    DisciplineBase:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    DisciplineRequest:
      allOf:
        - $ref: '#/components/schemas/DisciplineBase'
    DisciplineResponse:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
        - $ref: '#/components/schemas/DisciplineBase'

    GroupBase:
      type: object
      required:
        - name
        - students_amount
        - type
      properties:
        name:
          type: string
        students_amount:
          type: integer
          minimum: 1
        type:
          type: string
          enum: [ part_time, undergraduate, postgraduate ]
    GroupRequest:
      allOf:
        - $ref: '#/components/schemas/GroupBase'
    GroupResponse:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
        - $ref: '#/components/schemas/GroupBase'

    UserBase:
      type: object
      required:
        - name
        - role
      properties:
        name:
          type: string
        role:
          type: string
          enum: [ admin, editor, teacher ]
        associated_teacher_id:
          type: integer
          minimum: 1
    UserRequest:
      allOf:
        - $ref: '#/components/schemas/UserBase'
    UserResponse:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
        - $ref: '#/components/schemas/UserBase'

    FileBase:
      type: object
      required:
        - id
        - name
        - created_at
        - type
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time


    FileImportBase:
      allOf:
        - $ref: '#/components/schemas/FileBase'
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - main
                - postgraduate
                - undergraduate
                - part_time
            term:
              type: integer
              enum:
                - 1
                - 2
            is_extra:
              type: boolean

    FileExportBase:
      allOf:
        - $ref: '#/components/schemas/FileBase'

    FileReportBase:
      allOf:
        - $ref: '#/components/schemas/FileBase'
        - type: object
          required:
            - teacher_id
          properties:
            teacher_id:
              type: integer

    FileReportResponse:
      allOf:
        - $ref: '#/components/schemas/FileReportBase'
        - type: object
          required:
            - teacher
          properties:
            teacher:
              $ref: '#/components/schemas/TeacherResponse'

    RecordBase:
      type: object
      required:
        - id
        - import_file_id
        - group_id
        - discipline_id
        - subgroup_number
        - term
        - type
        - goal_hours
        - current_hours
        - teachers_ids
        - is_error
      properties:
        id:
          type: integer
          minimum: 1
        import_file_id:
          type: integer
          minimum: 1
        group_id:
          type: integer
        discipline_id:
          type: integer
        subgroup_number:
          type: integer
          minimum: 0
        term:
          type: integer
          enum: [ 1, 2 ]
        type:
          type: string
          enum:
            - lecture              # Лек
            - practice             # Пр
            - lab                  # Лаб
            - ksr                  # КСР

            - course_project       # КП
            - course_work          # КР
            - control_work         # КонтрРаб

            - pass                 # Зач
            - graded_pass          # ДифЗач
            - exam                 # Экз
            - state_exam           # ГосЭкз
            - gek                  # ГЭК

            - thesis_supervision   # РукВКР
            - reviewing            # Рец

            - study_practice       # УчПр
            - work_practice        # ПрПр
            - pre_diploma_practice # ПредПр
        goal_hours:
          type: integer
          minimum: 1
        current_hours:
          type: integer
          minimum: 0
        teachers_ids:
          type: array
          items:
            type: object
            required:
              - teacher_id
              - hours
              - is_extra
            properties:
              teacher_id:
                type: integer
                minimum: 1
              hours:
                type: integer
                minimum: 1
              is_extra:
                type: boolean
        is_error:
          type: boolean
    RecordResponse:
      allOf:
        - $ref: '#/components/schemas/RecordBase'
        - type: object
          required:
            - group
            - discipline
            - teachers
            - import_file
          properties:
            group:
              $ref: '#/components/schemas/GroupResponse'
            discipline:
              $ref: '#/components/schemas/DisciplineResponse'
            teachers:
              type: array
              items:
                $ref: '#/components/schemas/TeacherResponse'
            import_file:
              $ref: '#/components/schemas/FileImportBase'

    Calculations:
      type: object
      required:
        - full_time_hours_term1
        - full_time_hours_term2
        - postgraduate_hours_term1
        - postgraduate_hours_term2
        - part_time_hours_term1
        - part_time_hours_term2
      properties:
        full_time_hours_term1:
          type: integer
          description: Часы очников 1 сем (основная + доп.)
        full_time_hours_term2:
          type: integer
          description: Часы очников 2 сем (основная + доп.)

        postgraduate_hours_term1:
          type: integer
          description: Часы аспирантуры 1 сем
        postgraduate_hours_term2:
          type: integer
          description: Часы аспирантуры 2 сем

        calculated_wage:
          type: number
          description: Выработанная доля ставки

        part_time_hours_term1:
          type: integer
          description: Часы заочников 1 сем
        part_time_hours_term2:
          type: integer
          description: Часы заочников 2 сем

        part_time_cost_yearly:
          type: integer
          description: Начислено за заочников за год, ₽

        wage_diff_hours:
          type: integer
          description: Отклонение от нормы ставки + перегруз, - недобор

    ActionBase:
      type: object
      required:
        - id
        - user_id
        - created_at
        - is_reverted
        - diffs
      properties:
        id:
          type: integer
          minimum: 1
        user_id:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        is_reverted:
          type: boolean
        diffs:
          type: array
          items:
            type: object
            required:
              - record_id
              - teacher_id
            properties:
              record_id:
                type: integer
                minimum: 1
              teacher_id:
                type: integer
                minimum: 1
              old_hours:
                type: integer
                minimum: 1
              new_hours:
                type: integer
                minimum: 1
              old_is_extra:
                type: boolean
              new_is_extra:
                type: boolean

    Error:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - CODE_BAD_REQUEST
            - CODE_UNAUTHORIZED
            - CODE_FORBIDDEN
            - CODE_UNKNOWN_YEAR
            - CODE_UNKNOWN_TEACHER
            - CODE_UNKNOWN_GROUP
            - CODE_UNKNOWN_DISCIPLINE
            - CODE_UNKNOWN_USER
            - CODE_UNKNOWN_FILE
            - CODE_UNKNOWN_ACTION
        message:
          type: string