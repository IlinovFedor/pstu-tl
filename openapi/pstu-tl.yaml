      tags:
        - Diff
      summary: Сравнительная таблица с другим годом
      parameters:
        - name: target_year_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Таблица по (дисциплинам, часам)/преподавателям
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_year:
                    $ref: '#/components/schemas/YearResponse'
                  target_year:
                    $ref: '#/components/schemas/YearResponse'
                  rows:
                    type: array
                    items:
                      type: object
                      required:
                        - discipline
                        - term
                        - status
                        - current_hours
                        - current_teachers
                        - target_hours
                        - target_teachers
                      properties:
                        discipline:
                          $ref: '#/components/schemas/DisciplineResponse'
                        term: # 0 - оба
                          type: integer
                          enum:
                            - 0
                            - 1
                            - 2
                        status:
                          type: string
                          enum:
                            - removed
                            - added
                            - kept
                            -
                        current_hours:
                          type: integer
                        current_teachers:
                          type: array
                          items:
                            type: string

                        target_hours:
                          type: integer
                        taget_teachers:
                          type: array
                          items:
                            type: string
