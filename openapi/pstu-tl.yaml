  /years/{year_id}/import:
    parameters:
      - name: year_id
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Импорт данных из XLSX с перезаписью records. Для типов postgraduate undergraduate part_time требуется указать term. Отсутствующие сущности в общих каталогах добавляются.
      tags:
        - Years/Import
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - main
              - postgraduate
              - undergraduate
              - part_time
        - name: term
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 1
              - 2
        - name: is_extra
          in: query
          required: false
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Информация об импортированном файле
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileImportBase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Список текущих импортированных файлов
      tags:
        - Years/Import
      responses:
        '200':
          description: Данные файлов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileImportBase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
