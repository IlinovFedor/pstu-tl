      - name: year_id
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - Years/Export
      summary: Создание файла экспорта
      responses:
        '200':
          description: Данные нового файла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileExportBase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
