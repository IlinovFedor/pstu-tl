  /years/{yearId}/import:
    parameters:
      - name: yearId
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: ImportFile
      summary: Импорт данных из XLSX.
      description: Records перезаписываются для соответствующего типа файла (main, post/undergraduate + term + isExtra). Для типов postgraduate undergraduate partTime требуется указать term и is_extra. Отсутствующие сущности в каталогах системы добавляются.
      tags:
        - Import
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - main
              - postgraduate
              - undergraduate
              - partTime
        - name: term
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 1
              - 2
        - name: isExtra
          in: query
          required: false
          schema:
            type: boolean
      requestBody:
        description: |
          Файл Excel должен соответствовать **одной из трех схем**:
          
          ### 1. Файл учебных поручений
          
          ---
          
          ### 2. Схема «Для студентов»
          
          | Наименование дисциплины | Группа | Студентов | лекций | практик | КСР | лаборат. | экзамены | зачеты | КР и КП | контр. раб. | уч. прак. | ВКР | ГЭК | рец. ВКР |
          |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|
          
          ---
          
          ### 3. Схема «Для аспирантов»
          
          | Наименование дисциплины | Программа | Кафедра | СНР | Курс | Аспирантов | лекций | практик | КСР | лаборат. | экзамены | зачеты |
          |---|---|---|---|---|---|---|---|---|---|---|---|
        required: true
        content:
          multipart/form-data:
